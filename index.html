<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silly String</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <p class="eyebrow">The only real party value</p>
    <h1>Silly String</h1>

    <div class="photo-frame">
      <img src="images/silly-string.jpg" alt="A twelve-pack box of Silly String cans in red, blue, green, and pink">
    </div>

    <p class="tagline">Twelve cans. Four colors. Zero grown-up energy.</p>

    <section class="joke-card">
      <p class="joke-label">Dad joke break</p>
      <p class="joke-text" id="joke-text">Loading a joke…</p>
      <button class="joke-button" id="joke-button" type="button">Another one</button>
    </section>
  </main>

  <script>
    const jokeText = document.getElementById('joke-text');
    const jokeButton = document.getElementById('joke-button');

    async function getJoke() {
      jokeText.textContent = 'Loading a joke…';
      try {
        const res = await fetch('https://icanhazdadjoke.com/', {
          headers: { Accept: 'application/json' }
        });
        const data = await res.json();
        jokeText.textContent = data.joke;
      } catch (err) {
        jokeText.textContent = "Couldn't fetch a joke — silly string it is instead.";
      }
    }

    jokeButton.addEventListener('click', getJoke);
    getJoke();
  </script>
</body>
</html>
